# KiCAD Prism on Coolify (Docker Compose build pack).
#
# Derived from deploy/release/compose.yml for the v5.2.0-alpha release. It
# pulls the release's digest-pinned images, so the Coolify server does not
# build KiCad, Rust, or the viewer from source.
#
# Differences from the release bundle:
#   - No published ports and no Caddy service. Assign the domain to the
#     `frontend` service in Coolify; its proxy terminates TLS and forwards to
#     frontend:80, which proxies the API to backend:8000 on the stack network.
#   - No container_name, so Coolify can name and replace containers itself.
#   - No env_file. Every setting is listed per service so Coolify shows it under
#     Environment Variables. Values left empty fall back to the Prism defaults.
#   - POSTGRES_PASSWORD and SESSION_SECRET are generated by Coolify through its
#     SERVICE_PASSWORD_* magic variables and persist across redeploys.
#   - Authentication is always on, password login is enabled by default, and
#     CPU ceilings and concurrency are sized for a 4 vCPU / 16 GB server.
#
# Linux AMD64 servers only; native ARM64 images are not published.
# Setup and upgrade steps: deploy/coolify/README.md.

services:
  postgres:
    image: ${PRISM_POSTGRES_IMAGE:-postgres:17-alpine}
    platform: linux/amd64
    restart: unless-stopped
    shm_size: 256mb
    # Loaded so the ops get_slow_queries diagnostic can read query timings
    # (ADR §11, D25). Removing it only makes that tool report available=false.
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=top"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kicad_prism}
      POSTGRES_USER: ${POSTGRES_USER:-kicad_prism}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - prism-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: ${PRISM_BACKEND_IMAGE:-ghcr.io/krishna-swaroop/kicad-prism-backend@sha256:c974b18c30db3259316bd693adfe6f280c545c2686513853db8c4231a0c676ec}
    platform: linux/amd64
    restart: unless-stopped
    # Ceilings, not reservations. A cpus value above the server's CPU count
    # stops the container from being created.
    cpus: ${PRISM_BACKEND_CPU_LIMIT:-2.0}
    mem_limit: ${PRISM_BACKEND_MEMORY_LIMIT:-4g}
    environment:
      DEV_MODE: "false"
      KICAD_PROJECTS_ROOT: /app/projects
      PRISM_DATABASE_URL: postgresql://${POSTGRES_USER:-kicad_prism}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-kicad_prism}
      PRISM_DATABASE_POOL_MAX_SIZE: ${PRISM_DATABASE_POOL_MAX_SIZE:-10}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      WORKSPACE_NAME: ${WORKSPACE_NAME:-KiCAD Prism}

      # The exact HTTPS origin assigned to the frontend service in Coolify.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL to the frontend domain}
      CORS_ORIGINS_STR: ${PUBLIC_BASE_URL}

      # Guest mode is never appropriate on a publicly routed Coolify domain.
      AUTH_ENABLED: "true"
      SESSION_SECRET: ${SERVICE_PASSWORD_64_SESSION}
      BOOTSTRAP_ADMIN_USERS_STR: ${BOOTSTRAP_ADMIN_USERS_STR:?Set the first administrator email}
      # Seeded once for the bootstrap admins; clear it after first sign-in.
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      PASSWORD_AUTH_ENABLED: ${PASSWORD_AUTH_ENABLED:-true}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-SSO}
      ALLOWED_USERS_STR: ${ALLOWED_USERS_STR:-}
      ALLOWED_DOMAINS_STR: ${ALLOWED_DOMAINS_STR:-}
      DEFAULT_VIEWER_DOMAINS_STR: ${DEFAULT_VIEWER_DOMAINS_STR:-}

      # Required only for tracker connectors. Generate with: openssl rand -hex 32
      TRACKER_CREDENTIAL_ROOT_KEY: ${TRACKER_CREDENTIAL_ROOT_KEY:-}
      TRACKER_CREDENTIAL_ROOT_KEY_ID: ${TRACKER_CREDENTIAL_ROOT_KEY_ID:-v1}
      TRACKER_CREDENTIAL_PREVIOUS_ROOT_KEY: ${TRACKER_CREDENTIAL_PREVIOUS_ROOT_KEY:-}
      TRACKER_CREDENTIAL_PREVIOUS_ROOT_KEY_ID: ${TRACKER_CREDENTIAL_PREVIOUS_ROOT_KEY_ID:-}
      # Signs image links in published tracker issues. Unset sends the file
      # name instead. Generate with: openssl rand -hex 32
      COMMENT_ATTACHMENT_LINK_SECRET: ${COMMENT_ATTACHMENT_LINK_SECRET:-}

      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      PRISM_FORGE_HOSTS: ${PRISM_FORGE_HOSTS:-}
      IMPORT_ALLOWED_HOSTS_STR: ${IMPORT_ALLOWED_HOSTS_STR:-}

      PRISM_WORKER_CONCURRENCY: ${PRISM_WORKER_CONCURRENCY:-2}
      CATALOG_WORKER_CONCURRENCY: ${CATALOG_WORKER_CONCURRENCY:-1}
      CATALOG_KICAD_CONCURRENCY: ${CATALOG_KICAD_CONCURRENCY:-1}
      PRISM_DESIGN_BUNDLE_AUTO_BUILD: ${PRISM_DESIGN_BUNDLE_AUTO_BUILD:-true}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Relative paths keep the release bundle's data/ layout, which Coolify
      # places under its application directory on the server.
      - ./data/projects:/app/projects
      - ./data/ssh:/root/.ssh:rw

  catalog-worker:
    image: ${PRISM_BACKEND_IMAGE:-ghcr.io/krishna-swaroop/kicad-prism-backend@sha256:c974b18c30db3259316bd693adfe6f280c545c2686513853db8c4231a0c676ec}
    platform: linux/amd64
    restart: unless-stopped
    cpus: ${CATALOG_WORKER_CPU_LIMIT:-2.0}
    mem_limit: ${CATALOG_WORKER_MEMORY_LIMIT:-4g}
    environment:
      KICAD_PROJECTS_ROOT: /app/projects
      PRISM_DATABASE_URL: postgresql://${POSTGRES_USER:-kicad_prism}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-kicad_prism}
      PRISM_DATABASE_POOL_MIN_SIZE: "1"
      PRISM_DATABASE_POOL_MAX_SIZE: ${CATALOG_WORKER_DATABASE_POOL_MAX_SIZE:-4}
      PRISM_WORKER_CONCURRENCY: ${PRISM_WORKER_CONCURRENCY:-2}
      CATALOG_WORKER_CONCURRENCY: ${CATALOG_WORKER_CONCURRENCY:-1}
      CATALOG_KICAD_CONCURRENCY: ${CATALOG_KICAD_CONCURRENCY:-1}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data/projects:/app/projects
    healthcheck:
      test:
        - CMD-SHELL
        - test -r /proc/1/cmdline && grep -aq 'app.prism_worker' /proc/1/cmdline
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 10
    command:
      - /app/venv/bin/python
      - -m
      - app.prism_worker
      - --pool
      - catalog

  prism-worker:
    image: ${PRISM_BACKEND_IMAGE:-ghcr.io/krishna-swaroop/kicad-prism-backend@sha256:c974b18c30db3259316bd693adfe6f280c545c2686513853db8c4231a0c676ec}
    platform: linux/amd64
    restart: unless-stopped
    cpus: ${PRISM_WORKER_CPU_LIMIT:-2.0}
    mem_limit: ${PRISM_WORKER_MEMORY_LIMIT:-8g}
    environment:
      KICAD_PROJECTS_ROOT: /app/projects
      PRISM_DATABASE_URL: postgresql://${POSTGRES_USER:-kicad_prism}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-kicad_prism}
      PRISM_DATABASE_POOL_MIN_SIZE: "1"
      PRISM_DATABASE_POOL_MAX_SIZE: ${PRISM_WORKER_DATABASE_POOL_MAX_SIZE:-6}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL to the frontend domain}

      TRACKER_CREDENTIAL_ROOT_KEY: ${TRACKER_CREDENTIAL_ROOT_KEY:-}
      TRACKER_CREDENTIAL_ROOT_KEY_ID: ${TRACKER_CREDENTIAL_ROOT_KEY_ID:-v1}
      TRACKER_CREDENTIAL_PREVIOUS_ROOT_KEY: ${TRACKER_CREDENTIAL_PREVIOUS_ROOT_KEY:-}
      TRACKER_CREDENTIAL_PREVIOUS_ROOT_KEY_ID: ${TRACKER_CREDENTIAL_PREVIOUS_ROOT_KEY_ID:-}
      COMMENT_ATTACHMENT_LINK_SECRET: ${COMMENT_ATTACHMENT_LINK_SECRET:-}

      # Imports, sync, and Release Studio publishing run in this worker.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      PRISM_FORGE_HOSTS: ${PRISM_FORGE_HOSTS:-}
      IMPORT_ALLOWED_HOSTS_STR: ${IMPORT_ALLOWED_HOSTS_STR:-}

      PRISM_WORKER_CONCURRENCY: ${PRISM_WORKER_CONCURRENCY:-2}
      CATALOG_WORKER_CONCURRENCY: ${CATALOG_WORKER_CONCURRENCY:-1}
      CATALOG_KICAD_CONCURRENCY: ${CATALOG_KICAD_CONCURRENCY:-1}
      # Builds a design bundle after every import and sync, and prebuilds each
      # branch's newest commits and every tag, one at a time. Set false on a
      # small server to build bundles only when a page needs one.
      PRISM_DESIGN_BUNDLE_AUTO_BUILD: ${PRISM_DESIGN_BUNDLE_AUTO_BUILD:-true}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data/projects:/app/projects
      - ./data/ssh:/root/.ssh:rw
    healthcheck:
      test:
        - CMD-SHELL
        - test -r /proc/1/cmdline && grep -aq 'app.prism_worker' /proc/1/cmdline
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 10
    command:
      - /app/venv/bin/python
      - -m
      - app.prism_worker

  frontend:
    image: ${PRISM_FRONTEND_IMAGE:-ghcr.io/krishna-swaroop/kicad-prism-frontend@sha256:e18f994ddca41fc6fb9865d55f717dc60643dfd22bc1bfc9de11eb714ffb73b3}
    platform: linux/amd64
    restart: unless-stopped
    # Coolify routes the assigned domain to this container's port 80.
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./data/projects:/srv/prism-projects:ro

volumes:
  prism-postgres-data:
